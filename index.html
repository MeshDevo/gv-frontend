<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Voice - Anime Dub Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GOLDEN VOICE</p>
          <h1>Anime Dub Platform</h1>
        </div>
        <div class="nav-links">
          <button id="loginBtn" class="btn btn-secondary">Login</button>
          <button id="registerBtn" class="btn btn-primary">Register</button>
        </div>
      </header>

      <main id="mainContent" class="main-content">
        <!-- Login Form -->
        <div id="loginSection" class="form-section active">
          <div class="form-container">
            <h2>Sign In</h2>
            <form id="loginForm">
              <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required />
              </div>
              <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
          </div>
        </div>

        <!-- Register Form -->
        <div id="registerSection" class="form-section">
          <div class="form-container">
            <h2>Create Account</h2>
            <form id="registerForm">
              <div class="form-group">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" required />
              </div>
              <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" required />
              </div>
              <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
          </div>
        </div>

        <!-- Dashboard (after login) -->
        <div id="dashboardSection" class="dashboard-section">
          <div class="dashboard-header">
            <h2>Welcome, <span id="userName"></span>!</h2>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
          </div>

          <div class="works-container">
            <h3>Latest Works</h3>
            <div id="worksList" class="works-grid"></div>
          </div>
        </div>
      </main>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
